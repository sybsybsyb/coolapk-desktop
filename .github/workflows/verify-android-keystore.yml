name: Verify Android Keystore

on:
  workflow_dispatch:
    inputs:
      alias_override:
        description: '临时覆盖 ANDROID_KEY_ALIAS（留空则使用 Secret）'
        required: false
        type: string
      key_password_override:
        description: '临时覆盖 ANDROID_KEY_PASSWORD（留空则使用 Secret）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: 验证 Android 签名密钥
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      # 优先使用手动输入的覆盖值，留空时回落到 Secrets
      EFFECTIVE_ALIAS: ${{ inputs.alias_override || secrets.ANDROID_KEY_ALIAS }}
      EFFECTIVE_KEYPASS: ${{ inputs.key_password_override || secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 检查 Secrets 是否齐全
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=()
          [[ -z "$KS_B64" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "$KS_PASS" ]] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "$EFFECTIVE_ALIAS" ]] && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "$EFFECTIVE_KEYPASS" ]] && missing+=("ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "❌ 缺少以下 Secrets: ${missing[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "请在 Settings → Secrets and variables → Actions 中补齐后重试。"
            exit 1
          fi
          echo "✅ 4 项配置均已就位"
          echo "- keystore Base64 长度: ${#KS_B64}"
          echo "- 使用 alias: $EFFECTIVE_ALIAS"
          if [[ "$EFFECTIVE_KEYPASS" == "$KS_PASS" ]]; then
            echo "- keypass 与 storepass: 相同"
          else
            echo "- keypass 与 storepass: 不同"
          fi

      - name: 解码 keystore
        id: decode
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/verify-upload.jks"
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$KS"
          size=$(wc -c < "$KS")
          echo "keystore 大小: $size 字节"
          if (( size < 100 )); then
            echo "❌ 解码后文件过小（$size 字节），Base64 内容可能有误"
            exit 1
          fi
          head_hex=$(head -c 4 "$KS" | od -An -tx1 | tr -d ' \n')
          echo "文件头 (hex): $head_hex"
          case "$head_hex" in
            feedfeed) echo "文件格式: JKS" ;;
            3082*|3081*|3083*) echo "文件格式: PKCS12" ;;
            *) echo "⚠️ 未知文件头，继续尝试解析" ;;
          esac
          echo "keystore_path=$KS" >> "$GITHUB_OUTPUT"

      - name: 验证 storepass
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="${{ steps.decode.outputs.keystore_path }}"
          if ! keytool -J-Duser.language=en -J-Duser.country=US \
                -list -keystore "$KS" -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "❌ storepass 错误，或 keystore 已损坏"
            exit 1
          fi
          echo "✅ storepass 正确"

      - name: 列出所有 alias
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="${{ steps.decode.outputs.keystore_path }}"
          echo "=== keystore 中所有条目 ==="
          keytool -J-Duser.language=en -J-Duser.country=US \
            -list -keystore "$KS" -storepass "$KS_PASS" \
            | grep -E '^(Alias name|Entry type)' || true
          echo "==========================="

      - name: 检查 alias 存在
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="${{ steps.decode.outputs.keystore_path }}"
          if ! keytool -J-Duser.language=en -J-Duser.country=US \
                -list -keystore "$KS" -storepass "$KS_PASS" \
                -alias "$EFFECTIVE_ALIAS" >/dev/null 2>&1; then
            echo "❌ alias 不存在: '$EFFECTIVE_ALIAS'"
            echo "请对照上一步输出的 Alias name，修正 ANDROID_KEY_ALIAS"
            exit 1
          fi
          echo "✅ alias 存在: $EFFECTIVE_ALIAS"

      - name: 端到端签名测试
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="${{ steps.decode.outputs.keystore_path }}"
          tmp="$(mktemp -d)"
          echo test > "$tmp/empty.txt"
          ( cd "$tmp" && jar cf test.jar empty.txt )

          err="$tmp/jarsigner.err"
          set +e
          jarsigner -J-Duser.language=en -J-Duser.country=US \
            -keystore "$KS" \
            -storepass "$KS_PASS" \
            -keypass "$EFFECTIVE_KEYPASS" \
            "$tmp/test.jar" "$EFFECTIVE_ALIAS" 2>"$err"
          rc=$?
          set -e

          if [[ -s "$err" ]]; then
            echo "--- jarsigner stderr ---"
            grep -vE '^\s*$' "$err" || true
            echo "------------------------"
          fi

          if (( rc != 0 )); then
            echo "❌ 签名失败（exit $rc）"
            echo "常见原因："
            echo "  1) ANDROID_KEY_PASSWORD 错误"
            echo "  2) alias 指向的条目不是 PrivateKeyEntry"
            exit 1
          fi

          if grep -qi 'Different store and key passwords not supported for PKCS12' "$err"; then
            echo "⚠️ 检测到 PKCS12 keystore：keypass 被忽略，实际使用的是 storepass。"
            echo "   Android Gradle Plugin 在 PKCS12 下同样忽略 keypass，"
            echo "   建议把 ANDROID_KEY_PASSWORD 设为与 ANDROID_KEYSTORE_PASSWORD 相同。"
          fi

          echo "✅ jarsigner 签名测试通过"
          rm -rf "$tmp"

      - name: 汇总结论
        if: success()
        shell: bash
        run: |
          {
            echo "## ✅ Android 签名密钥验证通过"
            echo ""
            echo "- 使用 alias: \`$EFFECTIVE_ALIAS\`"
            echo "- keystore 与密码匹配，alias 存在，keypass 可用"
            echo "- 可直接用于 \`npm run android:build\` 的 Release 构建"
          } >> "$GITHUB_STEP_SUMMARY"
